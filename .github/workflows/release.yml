name: Release

# Push a tag matching `v*` (e.g. `v0.2.0`) to build every platform below
# and publish a GitHub Release with short notes plus each platform's
# archive attached. `workflow_dispatch` runs the exact same build matrix
# without publishing anything — a safe way to test this pipeline (e.g.
# after editing this file) without cutting a real tag/release each time;
# its results just show up as this workflow run's own downloadable
# artifacts instead.
#
# arm64 Windows/Linux builds are deliberately not included yet (noted,
# not forgotten) — GitHub-hosted runners for those are less mature than
# the four targets here; add them as their own matrix entries once
# that's worth revisiting.
#
# Release notes come from CHANGELOG.md's top `## ...` section verbatim
# (see the `release` job below) — following "Keep a Changelog" style,
# that section is renamed from `## Unreleased` to `## vX.Y.Z` (with a
# fresh empty `## Unreleased` added above it) and `[workspace.package]
# version` in `Cargo.toml` is bumped to match, before the tag is pushed.
# Not enforced by this workflow itself — see `.waypoint/skills/
# version-bump.md`, which handles the whole thing on request (bump,
# commit, push to main, and — with the developer's explicit
# confirmation each time — tag and push the tag too).
#
# `apt-repo` publishes the Linux build to a GPG-signed APT repository
# hosted on the `gh-pages` branch (see that job for the full mechanics).
# Like `release`, it only runs on a real tag push by default — a plain
# `workflow_dispatch` build-matrix test shouldn't have the side effect of
# publishing to the real public repo. The `publish_apt_repo` input is the
# deliberate escape hatch for the one case that needs it anyway: manually
# backfilling a version into the APT repo without cutting a new release
# (e.g. the first time this job is added, for whatever the latest tag
# already is).

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_apt_repo:
        description: "Also publish this run's Linux build to the APT repo (normally only a real tag push does this)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # winit/wgpu/arboard load these via `dlopen` at runtime rather than
      # linking them at compile time (confirmed by inspecting the built
      # binary — `ldd` shows only libc/libm/libgcc_s), so these `-dev`
      # packages are very likely not actually required just to *build* —
      # installed anyway since a stale/broken CI build is a worse outcome
      # than one harmless extra `apt-get` call, and this hasn't been
      # verified in a from-scratch container.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxcursor-dev libxi-dev libxkbcommon-dev libwayland-dev libvulkan-dev libegl1-mesa-dev

      # A single command builds *and* packages the `.deb` — cargo-deb
      # invokes `cargo build --release --target ...` itself and resolves
      # `[package.metadata.deb] assets`' `target/release/...` paths
      # against whatever `--target` it was given automatically (confirmed
      # directly: running it with a pre-built-without-`--target` binary
      # and `--no-build` fails looking for `target/<triple>/release/pain`,
      # so letting it do its own build is what keeps the two in sync).
      - name: Build and package .deb (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          cargo deb -p pain --target ${{ matrix.target }}

      - name: Build (Windows/macOS)
        if: runner.os != 'Linux'
        run: cargo build --release --target ${{ matrix.target }} -p pain

      - name: Package archive (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          stage="pain-${{ matrix.name }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/pain" "$stage/"
          cp LICENSE README.md "$stage/"
          tar -czf "$stage.tar.gz" "$stage"
          mkdir -p dist
          mv "$stage.tar.gz" dist/
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp target/debian/*.deb dist/
          fi

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "pain-${{ matrix.name }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/pain.exe" $stage/
          Copy-Item LICENSE, README.md $stage/
          Compress-Archive -Path "$stage/*" -DestinationPath "$stage.zip"
          New-Item -ItemType Directory -Path dist | Out-Null
          Move-Item "$stage.zip" dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pain-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Everything under the heading matching *this tag* specifically —
      # not just "the first `## ` heading found". `version-bump.md`'s own
      # process leaves a permanent empty `## Unreleased` heading sitting
      # above every past `## vX.Y.Z` section (that's the whole point — a
      # place for the next round of entries to land), so "first heading"
      # matched `## Unreleased` and grabbed nothing: confirmed on v1.0.0's
      # actual published release, whose notes came out empty. Matching
      # the tag name directly is what makes this correct release over
      # release, not just for a one-off fix.
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="## ${TAG}" '
            $0 == tag { found=1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: dist/*
          fail_on_unmatched_files: true

  # Publishes the Linux build to a flat, GPG-signed APT repository on the
  # `gh-pages` branch (GitHub Pages serves it as static files — no server
  # needed). Deliberately lightweight tooling for a single-package,
  # single-architecture repo: `dpkg-scanpackages`/`apt-ftparchive`, not
  # reprepro/aptly, which earn their complexity with many packages or
  # distributions. The whole sequence (scan, sign, `apt-get update`
  # against the result) was verified end-to-end against a real `apt`
  # before writing this job, not assumed from documentation.
  apt-repo:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish_apt_repo == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: pain-linux-x86_64
          path: incoming

      # `dpkg-scanpackages`/`apt-ftparchive` come from `dpkg-dev`/
      # `apt-utils` respectively — likely already on `ubuntu-latest`, but
      # not verified against the actual runner image from this sandbox,
      # so installed explicitly rather than assumed.
      - name: Install repo-building tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg

      # `--multiversion` (below) is what makes it safe to layer this
      # secret import into the same job that keeps accumulating
      # historical `.deb`s in `pool/` — each version's own metadata
      # survives even once a newer one exists.
      - name: Import the repo signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          echo "KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')" >> "$GITHUB_ENV"

      # `gh-pages` is bootstrapped once (an empty orphan branch with just
      # `.nojekyll`/`index.html`) and always exists from here on, so this
      # is a plain checkout — no "create it if this is the first run"
      # fallback needed. (An earlier version tried to do that fallback
      # inline with `continue-on-error`, but `actions/checkout` partially
      # initializes the target directory — `git init` plus the `origin`
      # remote — even when the ref-resolution step itself fails, so the
      # fallback's own `git remote add origin` collided with a remote
      # that was already there. Simpler to guarantee the branch exists
      # than to make that fallback correctly idempotent.)
      - name: Check out the APT repo (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: apt-repo

      - name: Add this build's .deb to the pool
        run: |
          mkdir -p apt-repo/pool
          cp incoming/*.deb apt-repo/pool/

      - name: Rebuild the repository index and sign it
        working-directory: apt-repo
        run: |
          touch .nojekyll
          dpkg-scanpackages --multiversion pool > Packages
          gzip -9c Packages > Packages.gz
          rm -f Release
          apt-ftparchive release . > Release
          gpg --batch --yes --local-user "$KEYID" --detach-sign --armor -o Release.gpg Release
          gpg --batch --yes --local-user "$KEYID" --clearsign -o InRelease Release
          gpg --export --armor "$KEYID" > pain-archive-keyring.asc
          cat > index.html <<EOF
          <!doctype html><meta charset="utf-8"><title>pain APT repository</title>
          <pre>
          curl -fsSL https://${{ github.repository_owner }}.github.io/pain/pain-archive-keyring.asc | sudo gpg --dearmor -o /etc/apt/keyrings/pain.gpg
          echo "deb [signed-by=/etc/apt/keyrings/pain.gpg] https://${{ github.repository_owner }}.github.io/pain ./" | sudo tee /etc/apt/sources.list.d/pain.list
          sudo apt update && sudo apt install pain
          </pre>
          EOF

      - name: Commit and push gh-pages
        working-directory: apt-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add ${{ github.ref_name }} to apt repo" || echo "Nothing new to commit"
          git push origin HEAD:gh-pages
